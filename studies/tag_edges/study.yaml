# Tag size and side inset for the Neon glasses, phone only (Linear CAM-165).
# Which 16h5 tags in the app's bars place the phone well enough, at 10, 9 and 8 mm, with their
# black border 5 mm (as now) or 3 mm from the left/right screen edge: smaller tags give the feed back
# height, tags nearer the edges give the bars' content room. The Edge 40 Pro's side edges curve
# away and a one-handed grip covers them, so the third hold is one-handed with the thumb on the
# screen. Screen and scene camera at the settings test's best (21 Oct). About 3 minutes, then a
# 1-minute feed. Analyse with:
#   python -m socialeyes.gaze.ladder <neon recording folder> <session folder>
# Posts are copied from studies/settings_test (itself from studies/tag_bars).
id: tag_edges
title: Tag size and side inset, phone only (CAM-165)
version: 1
seed: 20251001                 # change it and every plan changes; never change it mid-study

platform:
  name: Pictogram              # never use a real platform's name or logo
  theme: light
  participant_handle: you      # name the participant's own comments appear under

labels:
  edited:
    text: "This image has been digitally altered"
    style: banner

factors:
  - name: edit
    design: within
    levels: [original, retouched]
    sets:
      image_version: "{level}"           # picks the image whose version is original/retouched
  - name: label
    design: within
    levels: [none, edited]
    sets:
      label: {none: null, edited: edited}
  - name: comments
    design: between
    levels: [neutral, appearance]
    # applies_to: all would also switch the comments of filler posts; every
    # filler would then need a neutral and an appearance comment set.
    applies_to: critical
    sets:
      comment_variant: "{level}"

feed:
  order: shuffle
  lead_in_fillers: 2
  max_run_same_cell: 2
  min_fillers_between_critical: 1
  done_button_after_s: 20
  time_limit_s: 60
  allow_likes: true
  allow_comment_typing: true   # participants can comment and reply (text and draft edits are logged)

logging:                       # besides gaze; see docs/EVENT_LOG.md
  touches: true                # raw touch points
  sensors: false
  screen_recording: false      # pilots only: Android asks permission every session
  front_camera:                # face video for expression analysis; add a camera_check
    enabled: false             # step before the recorded steps
    resolution: 720p
    fps: 30
    steps: [feed]

display:
  brightness: 0.30             # settings test 21 Oct: best with the scene camera below

neon:
  scene_exposure:              # Companion's auto exposure aiming darker: its brightness control runs
    mode: auto                 # -64..64 on the Neon, so -32 is halfway down ("auto -50%" in the test)
    brightness: -32
  template:                    # filled in Companion's recording template, if it has these fields
    Participant: "{participant_id}"
    Study: "{study_id}"

markers:                       # the tags chosen on 12 Oct, in the feed's own bars
  on_screen: {steps: [feed], layout: bars, family: tag16h5, size_mm: 10}

procedure:
  - {id: welcome, type: instructions, title: Tags at the edges,
     text: "The screen will show the feed with small black squares in its corners. Each time, hold the phone as asked and keep looking at the screen until it changes. It takes about three minutes."}
  - id: bars
    type: tag_bars
    variant_s: 4                 # each variant shows 4 s, twice per hold (forwards, then backwards)
    rounds: 2
    variants:                    # 16h5 at 10, 9 and 8 mm, each 5 mm (now) and 3 mm from the side edges
      - {family: tag16h5, size_mm: 10, side_inset_mm: 5, edge_gap_mm: 2}
      - {family: tag16h5, size_mm: 10, side_inset_mm: 3, edge_gap_mm: 2}
      - {family: tag16h5, size_mm: 9, side_inset_mm: 5, edge_gap_mm: 1.5}
      - {family: tag16h5, size_mm: 9, side_inset_mm: 3, edge_gap_mm: 1.5}
      - {family: tag16h5, size_mm: 8, side_inset_mm: 5, edge_gap_mm: 1.5}
      - {family: tag16h5, size_mm: 8, side_inset_mm: 3, edge_gap_mm: 1.5}
    holds:
      - Hold the phone the way you normally would.
      - "Hold the phone at arm's length: stretch your arm out fully."
      - Hold the phone in one hand and rest your thumb on the screen as if you were scrolling.
  - {id: feed, type: feed, instructions: "Now scroll the feed as you normally would for a minute."}
  - {id: end, type: end}

participants:
  n_plans: 8
  id_prefix: T
  id_digits: 2
