[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialeyes"
version = "0.1.0"
description = "Study compiler, device tools and gaze analysis for the SocialEyes mock social media feed."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "pillow>=10",
  "pyyaml>=6",
  "pydantic>=2.7",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
socialeyes = "socialeyes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
